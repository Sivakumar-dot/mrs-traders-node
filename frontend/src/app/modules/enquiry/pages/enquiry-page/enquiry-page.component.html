<section class="enquiry-grid">
  <article class="feature-card">
    <h2>Customer Enquiry Form</h2>
    <p>
      Use this form on your website to capture electrical and plumbing product enquiries and deliver them instantly to your admin WhatsApp.
    </p>

    <div class="feature-list">
      <div>MongoDB enquiry storage</div>
      <div>UUID request tracking</div>
      <div>WhatsApp admin notification</div>
      <div>Rate-limited API submission</div>
    </div>
  </article>

  <article class="form-card">
    <app-form-alert *ngIf="successMessage" type="success" [message]="successMessage"></app-form-alert>
    <app-form-alert *ngIf="errorMessage" type="error" [message]="errorMessage"></app-form-alert>

    <form [formGroup]="enquiryForm" (ngSubmit)="submit()" novalidate>
      <label>
        Customer Name
        <input type="text" formControlName="name" placeholder="Enter full name" />
        <span *ngIf="nameControl.touched && nameControl.invalid">Name is required.</span>
      </label>

      <label>
        Mobile Number
        <input type="tel" formControlName="mobile" placeholder="Enter WhatsApp mobile number" />
        <span *ngIf="mobileControl.touched && mobileControl.hasError('required')">Mobile number is required.</span>
        <span *ngIf="mobileControl.touched && mobileControl.hasError('pattern')">Enter 10 to 15 digits only.</span>
      </label>

      <label>
        Message
        <textarea rows="5" formControlName="message" placeholder="Need quotation for switches, pipes, fittings, or any items"></textarea>
        <span *ngIf="messageControl.touched && messageControl.invalid">Message is required.</span>
      </label>

      <button type="submit" [disabled]="submitting">
        {{ submitting ? 'Submitting...' : 'Send Enquiry' }}
      </button>
    </form>
  </article>
</section>
